id = "dmich/air-alert"
name = "Air Alert"
version = "1.0.0"
plugin_api = 42
author = "dmich"

[[setting]]
key = "panel_placement"
type = "select"
label_key = "settings.panel_placement"
default = "floating"
options = [
  { value = "floating", label_key = "settings.panel_placement.floating" },
  { value = "attached", label_key = "settings.panel_placement.attached" },
]

[[setting]]
key = "threat_notifications"
type = "select"
label_key = "settings.threat_notifications"
default = "new_and_updates"
options = [
  { value = "new_only", label_key = "settings.threat_notifications.new_only" },
  { value = "new_and_updates", label_key = "settings.threat_notifications.new_and_updates" },
]

[[service]]
id = "alerts"
entry = "service.luau"

[[widget]]
id = "air-alert"
entry = "widget.luau"

[[widget.setting]]
key = "display_mode"
type = "select"
label_key = "settings.display_mode"
default = "status"
options = [
  { value = "icon", label_key = "settings.display_mode.icon" },
  { value = "status", label_key = "settings.display_mode.status" },
  { value = "location_status", label_key = "settings.display_mode.location_status" },
]

[[widget.setting]]
key = "color_mode"
type = "select"
label_key = "settings.color_mode"
default = "monochrome"
options = [
  { value = "colored", label_key = "settings.color_mode.colored" },
  { value = "monochrome", label_key = "settings.color_mode.monochrome" },
]

[[panel]]
id = "alert-details"
entry = "status-panel-entry.luau"
width = 450
height = "content"
max_height = 600
placement = "floating"
open_near_click = true
keyboard_focus = "exclusive"

[[panel]]
id = "location-picker"
entry = "location-panel-entry.luau"
width = 340
height = "content"
max_height = 380
placement = "floating"
open_near_click = true
keyboard_focus = "exclusive"

# Placement is fixed per entry; navigation selects the shared setting's variant.
[[panel]]
id = "alert-details-attached"
entry = "status-panel-entry.luau"
width = 450
height = "content"
max_height = 600
placement = "attached"
open_near_click = true
keyboard_focus = "exclusive"

[[panel]]
id = "location-picker-attached"
entry = "location-panel-entry.luau"
width = 340
height = "content"
max_height = 380
placement = "attached"
open_near_click = true
keyboard_focus = "exclusive"
